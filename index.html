<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanban</title>
  <link rel="stylesheet" href="kanban.css">
</head>
<body>
  <main class="board" aria-label="Kanban board">
    <section class="column" data-status="backlog">
      <h2 class="column-header">Backlog-new</h2>
      <ul class="cards"></ul>
    </section>
    <section class="column" data-status="in-progress">
      <h2 class="column-header">In Progress</h2>
      <ul class="cards"></ul>
    </section>
    <section class="column" data-status="done">
      <h2 class="column-header">Done</h2>
      <ul class="cards"></ul>
    </section>
  </main>
</body>
</html>
